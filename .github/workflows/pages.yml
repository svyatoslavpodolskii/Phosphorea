name: Deploy GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'schedule' || github.event.repository.name == 'Phosphorea'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Installed PWAs keep their original scope. The compatibility site
          # follows the canonical source without moving users' local databases.
          repository: ${{ github.event.repository.name == 'Phosphorea' && 'svyatoslavpodolskii/Phosphoreya' || github.repository }}
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
